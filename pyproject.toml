[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "copilot-teams-bridge"
version = "1.0.0"
description = "Bridge Microsoft Teams ↔ GitHub Copilot CLI via Power Automate + asyncio daemon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Victor Tam" }]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
copilot-teams-bridge = "bridge.daemon:main"
copilot-teams-doctor = "bridge.doctor:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
